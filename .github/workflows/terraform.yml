name: "Terraform Deploy"

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# REQUIRED: Allows GitHub to generate the OIDC token
permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # This action trades the GitHub token for temporary AWS credentials using your IAM Role
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2 # Match your S3 bucket and resource region

      - name: Initialize Terraform
        run: terraform init

      - name: Plan / Apply Terraform Changes
        run: terraform apply -auto-approve
